name: Build APK

on:
  push:
    branches: [ "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # android-actions/setup-android@v3 已损坏：它会安装已被 Google 移除的 legacy "tools" 包，
      # 在新版 runner 上直接报 "Failed to find package 'tools'"（exit code 1）。
      # ubuntu-latest 自带完整 Android SDK，这里改用自带 sdkmanager 显式安装构建所需包。
      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret 未配置，跳过解密（构建将生成未签名包）"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > smsalarm.keystore
          fi

      # - name: Debug secrets
      #   run: |
      #     echo "KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD}"
      #     echo "KEY_ALIAS length: ${#KEY_ALIAS}"
      #     echo "KEY_PASSWORD length: ${#KEY_PASSWORD}"
          
      - name: Build Release APK
        run: ./gradlew :app:incrementVersionCode :app:assembleRelease

      # 用与 Gradle 相同的公式（git 提交数）生成唯一版本号，作为 artifact 名后缀。
      - name: Compute APK version
        run: |
          VC=$(git rev-list --count HEAD)
          echo "APK_VERSION=2.0.${VC}" >> "$GITHUB_ENV"
          echo "APK_VERSION=2.0.${VC}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.APK_VERSION }}
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk

      # - name: Verify APK signature
      #   run: |
      #     BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
      #     $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
